name: Validate repository

on:
  push:
    paths:
      - "**/*.md"
      - "**/*.py"
      - "data/knowledge-map.yml"
      - "scripts/validate_knowledge_map.rb"
      - ".github/workflows/validate-knowledge-map.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.py"
      - "data/knowledge-map.yml"
      - "scripts/validate_knowledge_map.rb"
      - ".github/workflows/validate-knowledge-map.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate graph structure
        run: ruby scripts/validate_knowledge_map.rb
      - name: Test local link checks
        run: python3 -m unittest discover -s tests -v
      - name: Validate local Markdown links
        run: python3 scripts/validate_local_links.py
