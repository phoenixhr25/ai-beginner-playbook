schema_version: 2
updated: "2026-10-01"
measurement_started: "2026-10-01"

# 第二版从这一日期开始记录真实激活与反馈，不回填无法核实的历史数字。
signal_defaults:
  activation_count: 0
  solved_count: 0
  failed_count: 0
  evidence_count: 0

learning_rules:
  propagation_decay: 0.70
  recommendation_limit: 2
  edge_weight:
    minimum: 0.10
    neutral: 0.50
    maximum: 0.90
    solved_delta: 0.10
    partial_delta: 0.05
    failed_delta: -0.10
    independent_evidence_delta: 0.05
  consolidation:
    minimum_independent_cases: 2
    requires_verified_guide: true
  stale_content:
    action: mark_for_reverification
    decay_by_time_alone: false

stages:
  - start
  - organize
  - connect
  - publish
  - troubleshoot
  - backup
  - feedback

node_types:
  - question
  - procedure
  - concept
  - mental_model
  - gap

statuses:
  - published
  - verifying
  - gap
  - outdated

relations:
  - requires
  - explains
  - next
  - same_root
  - verified_by
  - supersedes

nodes:
